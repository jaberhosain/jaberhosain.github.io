<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MD JABER HOSAIN | Portfolio</title>
    <script>
      // Single Page App redirect for GitHub Pages (supports both root <user>.github.io and /<repo>/ subpath)
      var l = window.location;
      var segments = l.pathname.split('/').filter(Boolean);
      var appRoutes = ['about', 'videos', 'design', 'skills', 'contact', 'admin', 'index.html'];
      var isRepoSubpath = l.hostname.endsWith('github.io') && segments.length > 0 && appRoutes.indexOf(segments[0].toLowerCase()) === -1;
      var pathSegmentsToKeep = isRepoSubpath ? 1 : 0;
      var basePath = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';

      if (l.pathname.toLowerCase().indexOf('/admin') !== -1) {
        l.replace(basePath + '#admin');
      } else {
        l.replace(
          basePath + '?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
